<!DOCTYPE html>
<html>
<head><title>Edit Student</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<div class="container">
    <h2>Edit Student</h2>
    <form method="POST">
        <input type="text" name="name" value="{{ student.name }}" required>
        <input type="text" name="roll_no" value="{{ student.roll_no }}" required>
        <input type="text" name="department" value="{{ student.department }}" required>
        <input type="email" name="email" value="{{ student.email }}" required>
        <input type="text" name="phone" value="{{ student.phone }}" required>
        <button type="submit">Update</button>
    </form>
    <a href="/">Back</a>
</div>
</body>
</html>
